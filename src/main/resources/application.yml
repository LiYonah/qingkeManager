# ==================== 轻客管家 — 应用配置 ====================

# ========== 服务端口 ==========
server:
  port: 8080
  # 开发时显示详细错误信息
  error:
    include-message: always
    include-exception: true

# ========== 数据库配置 ==========
spring:
  datasource:
    # JDBC 连接地址（支持环境变量覆盖：DB_HOST / DB_PORT / DB_NAME）
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:qingke_manager}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 数据库用户名（支持环境变量 DB_USERNAME 覆盖）
    username: ${DB_USERNAME:root}
    # 数据库密码（生产环境务必通过环境变量 DB_PASSWORD 或 SPRING_DATASOURCE_PASSWORD 覆盖默认值）
    password: ${DB_PASSWORD:Lzx040305}
    driver-class-name: com.mysql.cj.jdbc.Driver

# ========== MyBatis-Plus 配置 ==========
mybatis-plus:
  # 驼峰命名转换（数据库字段 user_name → Java 属性 userName）
  configuration:
    map-underscore-to-camel-case: true
    # 控制台打印 SQL（开发时开启方便调试）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # 全局实体配置
  global-config:
    db-config:
      # 主键策略：ASSIGN_ID = 雪花算法自动生成 Long 型 ID
      id-type: assign_id
      # 逻辑删除字段名
      logic-delete-field: isDeleted
      logic-delete-value: 1     # 已删除
      logic-not-delete-value: 0 # 未删除
  # Mapper XML 文件位置（如果使用 XML 方式写 SQL）
  # mapper-locations: classpath*:/mapper/**/*.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ========== 日志级别 ==========
logging:
  level:
    com.qingke.manager: debug
    org.springframework: info
    org.springdoc: debug